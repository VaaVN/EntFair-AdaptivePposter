<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ярмарка деревьев - вебплакат</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="shortcut icon"
      href="assets\img\favicon.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <section class="label black">
      <div class="runningLine green">
        <h2>Приходите скорее к нам , на самую необычную ярмарку страны</h2>
      </div>
      <h1>ЯРМАРКА<br />ДЕРЕВЬЕВ</h1>
      <div class="runningLine yellow">
        <h2>
          Только у нас проводиться ежегодный съезд живых деревьев со всей страны
        </h2>
      </div>
    </section>
    <section class="screen2">
      <div class="locationDateRot">
        <div class="rotates">
          <div class="emblem red"><p>а</p></div>
          <div class="leaf green"></div>
        </div>
        <div class="locationDate">
          <div class="date yellow"></div>
          <div class="location">
            <div class="adress white"></div>
            <div class="taxi red"></div>
          </div>
        </div>
      </div>
      <div class="timeSaleTree">
        <div class="sale"></div>
        <div class="timeTree">
          <div class="time"></div>
          <div class="tree"></div>
        </div>
      </div>
    </section>
    <footer></footer>
  </body>
</html>
